[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidpipe"
version = "1.3.0"
description = "Конвейер производства YouTube-роликов: тема -> сценарий -> озвучка -> субтитры -> раскадровка -> промпты Flow"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "num2words>=0.5.13",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
# audit и marks работают с кадрами: разбор клипов, маски, заплатки
audit = ["opencv-python>=4.8", "numpy>=1.24"]
# сверка кадра со своим промптом в audit; без них шаг просто пропускается
match = ["torch>=2.0", "transformers>=4.40", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
vidpipe = "vidpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vidpipe = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
